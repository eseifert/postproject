name: Publish documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install --yes doxygen
      - run: python -m pip install --disable-pip-version-check -r docs/requirements.txt
      - run: doxygen Doxyfile
      - run: python tools/normalize_doxygen_xml.py target/doxygen/xml
      - run: python tools/check_docs_coverage.py include/postproject/postproject.h target/doxygen/xml
      - run: sphinx-build --fail-on-warning --keep-going -b html docs target/site
      - run: cargo doc --workspace --all-features --no-deps --locked
      - name: Add versioned and Rust references
        shell: bash
        run: |
          mkdir -p target/versioned
          cp -a target/site/. target/versioned/
          mkdir -p target/site/0.3.0-alpha.1 target/site/rustdoc
          cp -a target/versioned/. target/site/0.3.0-alpha.1/
          cp -a target/doc/. target/site/rustdoc/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4

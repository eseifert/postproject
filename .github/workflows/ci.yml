name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The public CLI binary and C library intentionally share the installed
      # name `postproject`. MSVC otherwise races while writing postproject.pdb.
      - run: cargo test --workspace --all-features --locked --exclude postproject-ffi
      - run: cargo test -p postproject-ffi --all-features --locked

  quality:
    name: Formatting, lints, and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --bins --locked -- -D warnings

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features --config fuzz/deny.toml
          manifest-path: fuzz/Cargo.toml

  c-abi:
    name: C ABI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p postproject-ffi
      - run: >-
          cc -std=c11 -Wall -Wextra -Werror
          -Iinclude tests/abi/c_smoke.c
          -Ltarget/release -lpostproject
          -Wl,-rpath,$PWD/target/release
          -o target/c-smoke
      - run: target/c-smoke target/c-smoke.pproj target
      - name: Verify exported ABI symbols
        shell: bash
        run: >-
          diff -u tests/abi/expected-symbols.txt
          <(nm -D --defined-only target/release/libpostproject.so |
          awk '{print $3}' | sort)

  cpp-package:
    name: Installed C and C++17 consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p postproject-ffi
      - name: Install native package
        run: >-
          cmake -S . -B target/cmake-package
          -DPOSTPROJECT_LIBRARY="$GITHUB_WORKSPACE/target/release/libpostproject.so"
          -DPOSTPROJECT_STATIC_LIBRARY="$GITHUB_WORKSPACE/target/release/libpostproject.a"
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/target/install"
          -DCMAKE_BUILD_TYPE=Release
      - run: cmake --install target/cmake-package
      - run: pkg-config --validate target/install/lib/pkgconfig/postproject.pc
      - name: Configure consumer without Cargo
        run: >-
          cmake -S tests/abi -B target/cpp-consumer
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/target/install"
          -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build target/cpp-consumer --config Release --parallel
      - run: ctest --test-dir target/cpp-consumer --build-config Release --output-on-failure
      - name: Verify and upload native package
        run: >-
          test -f target/install/lib/libpostproject.so -a
          -f target/install/lib/libpostproject.a -a
          -f target/install/include/postproject/postproject.h -a
          -f target/install/include/postproject/postproject.hpp
      - uses: actions/upload-artifact@v4
        with:
          name: libpostproject-linux-x86_64
          path: target/install
          if-no-files-found: error

  sanitizers:
    name: Native ASan and UBSan
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p postproject-ffi
      - name: Compile sanitized C consumer
        run: >-
          cc -std=c11 -Wall -Wextra -Werror
          -fsanitize=address,undefined -fno-omit-frame-pointer
          -Iinclude tests/abi/c_smoke.c
          -Ltarget/release -lpostproject
          -Wl,-rpath,$PWD/target/release
          -o target/c-smoke-sanitized
      - run: target/c-smoke-sanitized target/c-smoke-sanitized.pproj target
      - name: Install native package
        run: >-
          cmake -S . -B target/cmake-sanitized-package
          -DPOSTPROJECT_LIBRARY="$GITHUB_WORKSPACE/target/release/libpostproject.so"
          -DPOSTPROJECT_STATIC_LIBRARY="$GITHUB_WORKSPACE/target/release/libpostproject.a"
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/target/sanitized-install"
          -DCMAKE_BUILD_TYPE=Release
      - run: cmake --install target/cmake-sanitized-package
      - name: Configure sanitized C++ consumer
        run: >-
          cmake -S tests/abi -B target/cpp-sanitized
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/target/sanitized-install"
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS=-fsanitize=address,undefined
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
      - run: cmake --build target/cpp-sanitized --parallel
      - run: ctest --test-dir target/cpp-sanitized --output-on-failure
